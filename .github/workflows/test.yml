name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  neovim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        version: [v0.11.4, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - run: nvim --version
      - run: make test-nvim
